id: projects
name: Projects
version: 0.6.17
publisher: cbferrum
summary: Projects, task trees with dependencies, timesheets, time and milestone billing, profitability
description: README.md
categories: [projects]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-projects
support: https://github.com/CBFerrum/ferrum-app-projects/issues
runtime: native
platform: ">=0.3.2, <0.4"
packages: [projects]
uninstall: ask
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: projects
      route: projects
      title: Projects
      description: Projects with their boards, timelines and time; your work across projects; who is booked when; tasks and timesheets
      icon: folder-kanban
      color: "#b45309"
      roles: [Projects User, Projects Manager]
  shell.open:
    # A project opens in the project view (before ERP's records of the shared projects) and a task
    # on its own page; timesheets and the projects-erp connector's records in Projects' forms and lists.
    - {id: project, entity: Project, path: "projects/p/{id}", list: projects/, priority: 1}
    - {id: task, entity: Task, path: "projects/t/{id}", list: "projects/e/Task", priority: 1}
    - {id: projects, package: projects, path: "projects/e/{entity}/{id}", list: "projects/e/{entity}"}
    - {id: projects_erp, package: projects_erp, path: "projects/e/{entity}/{id}", list: "projects/e/{entity}"}
  shell.create:
    - {id: task, label: Task, path: projects/e/Task/new, entity: Task}
    - {id: project, label: Project, path: projects/e/Project/new, entity: Project}
  # Home's My work: your open tasks, due on their expected end.
  shell.work:
    - {id: tasks, title: Your tasks, endpoint: /api/app/projects/work}
  shell.notification:
    - {id: assigned, label: Tasks assigned to you, default: [inapp, email]}
  # What the assistant should know in Projects's pages, and what it suggests asking there.
  shell.assistant:
    - id: projects
      title: "Projects"
      instructions: >-
        A project's tasks (Open, Working, Pending Review, Overdue, Completed, Cancelled) form a tree with
        dependencies. A submitted Timesheet records time against tasks and is billed by the project's billing method.
        A ChangeRequest changes the scope once approved. Risks (ProjectRisk) and issues (ProjectIssue) are kept for
        each project. Profitability compares what was billed with the costs of timesheets and purchases.
      suggestions:
        - "Which tasks on my projects are overdue?"
        - "How many hours were logged this week, by project?"
        - "Which projects are over budget?"
        - "What time is not billed yet?"
