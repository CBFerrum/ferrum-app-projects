- name: ProjectRisk
  label: Risk
  kind: master
  module: projects
  title_field: title
  company_scoped: true
  owner_fields: [owner_email]
  fields:
    - {name: title, type: data, required: true, in_list: true}
    - {name: project, type: link, to: Project, required: true, in_list: true, in_filter: true}
    - {name: company, type: link, to: Company, fetch_from: project.company, read_only: true, in_filter: true}
    - {name: project_private, type: check, fetch_from: project.proj_private, read_only: true, hidden: true, no_copy: true, description: "Its project is its members' alone (kept in step with the project)"}
    - {name: probability, type: select, options: [Low, Medium, High], required: true, default: Medium, in_list: true}
    - {name: impact, type: select, options: [Low, Medium, High], required: true, default: Medium, in_list: true}
    - {name: exposure, type: int, read_only: true, in_list: true, description: "Probability times impact, 1 to 9"}
    - {name: status, type: select, options: [Open, Mitigating, Accepted, Closed], required: true, default: Open, in_list: true, in_filter: true}
    - {name: owner_email, type: email, label: Owner}
    - {name: review_by, type: date, in_list: true}
    - {name: mitigation, type: text}
  list: {columns: [title, project, probability, impact, exposure, status], sort: exposure desc}

- name: ProjectIssue
  label: Issue
  kind: master
  module: projects
  title_field: title
  company_scoped: true
  owner_fields: [owner_email]
  fields:
    - {name: title, type: data, required: true, in_list: true}
    - {name: project, type: link, to: Project, required: true, in_list: true, in_filter: true}
    - {name: company, type: link, to: Company, fetch_from: project.company, read_only: true, in_filter: true}
    - {name: project_private, type: check, fetch_from: project.proj_private, read_only: true, hidden: true, no_copy: true, description: "Its project is its members' alone (kept in step with the project)"}
    - {name: task, type: link, to: Task, in_filter: true}
    - {name: severity, type: select, options: [Low, Medium, High, Critical], required: true, default: Medium, in_list: true, in_filter: true}
    - {name: status, type: select, options: [Open, In Progress, Resolved, Closed], required: true, default: Open, in_list: true, in_filter: true}
    - {name: owner_email, type: email, label: Owner}
    - {name: description, type: text}
    - {name: resolution, type: text, required_if: "doc.status == 'Resolved' || doc.status == 'Closed'"}
  list: {columns: [title, project, severity, status], sort: created_at desc}

- name: ChangeRequest
  label: Change Request
  kind: document
  submittable: true
  module: projects
  title_field: title
  company_scoped: true
  numbering: {template: "CR-{YYYY}-{seq:5}", on: submit}
  fields:
    - {name: title, type: data, required: true, in_list: true}
    - {name: project, type: link, to: Project, required: true, in_list: true, in_filter: true}
    - {name: company, type: link, to: Company, fetch_from: project.company, read_only: true, in_filter: true}
    - {name: project_private, type: check, fetch_from: project.proj_private, read_only: true, hidden: true, no_copy: true, description: "Its project is its members' alone (kept in step with the project)"}
    - {name: reason, type: text, required: true}
    - {name: hours_impact, type: decimal, label: Effect on Hours, in_list: true}
    - {name: cost_impact, type: currency, label: Effect on Cost, in_list: true, perm_group: costing}
    - {name: days_impact, type: int, label: Effect on Schedule (Days), in_list: true}
    - {name: price_impact, type: currency, label: Effect on Contract Value, perm_group: costing, description: "For a fixed price project: what the change adds to the contract value"}
    - {name: decision, type: select, options: [Pending, Approved, Rejected], default: Pending, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: decided_by, type: email, read_only: true, no_copy: true}
    - {name: decided_at, type: datetime, read_only: true, no_copy: true}
    - {name: decision_note, type: text, read_only: true, no_copy: true}
  actions:
    - {name: approve, label: Approve, permission: submit, condition: "doc.docstatus == 1 && doc.decision == 'Pending'", params: [{name: note, type: text, label: Note}],
       contract: {returns: {type: object, properties: {decision: {type: string}}}, completion: "The change request is Approved and the project's plan moved by its effects, the first plan kept as its baseline"}}
    - {name: reject, label: Reject, permission: submit, condition: "doc.docstatus == 1 && doc.decision == 'Pending'", params: [{name: note, type: text, label: Note}],
       contract: {returns: {type: object, properties: {decision: {type: string}}}, completion: "The change request is Rejected; the project is unchanged"}}
  list: {columns: [number, title, project, decision, hours_impact, days_impact], sort: created_at desc}

- name: ResourceAllocation
  label: Resource Allocation
  kind: master
  module: projects
  title_field: person
  company_scoped: true
  owner_fields: [person]
  description: "Who is planned onto a project, when, and for how many hours a day. Over-allocation is reported, not refused: planners often know better."
  fields:
    - {name: person, type: email, required: true, in_list: true, in_filter: true, index: true}
    - {name: project, type: link, to: Project, required: true, in_list: true, in_filter: true}
    - {name: company, type: link, to: Company, fetch_from: project.company, read_only: true, in_filter: true}
    - {name: project_private, type: check, fetch_from: project.proj_private, read_only: true, hidden: true, no_copy: true, description: "Its project is its members' alone (kept in step with the project)"}
    - {name: task, type: link, to: Task}
    - {name: from_date, type: date, required: true, in_list: true, in_filter: true}
    - {name: to_date, type: date, required: true, in_list: true}
    - {name: hours_per_day, type: decimal, required: true, default: "8", min: "0.25", max: "24", in_list: true}
  rules:
    - {name: period, check: "doc.to_date >= doc.from_date", message: "An allocation cannot end before it starts"}
  list: {columns: [person, project, from_date, to_date, hours_per_day], sort: from_date desc}

- name: PortfolioProject
  label: Portfolio Project
  kind: child
  fields:
    - {name: project, type: link, to: Project, required: true, in_list: true}

- name: Portfolio
  label: Portfolio
  kind: master
  module: projects
  title_field: portfolio_name
  fields:
    - {name: portfolio_name, type: data, label: Name, required: true, unique: true, in_list: true}
    - {name: owner_email, type: email, label: Owner, in_list: true}
    - {name: projects, type: table, of: PortfolioProject}
    - {name: description, type: text}
  list: {columns: [portfolio_name, owner_email], sort: portfolio_name asc}

- name: BaselineTask
  label: Baseline Task
  kind: child
  fields:
    - {name: task, type: link, to: Task, in_list: true, on_delete: set_null, description: "The task, while it exists"}
    - {name: subject, type: data, in_list: true}
    - {name: exp_start_date, type: date, label: Planned Start, in_list: true}
    - {name: exp_end_date, type: date, label: Planned End, in_list: true}
    - {name: expected_hours, type: decimal}
    - {name: is_milestone, type: check}
    - {name: has_subtasks, type: check, description: "It had sub-tasks that were not cancelled: its plan is theirs, so it weighs nothing on its own"}

- name: ProjectBaseline
  label: Baseline
  kind: master
  module: projects
  title_field: baseline_name
  company_scoped: true
  description: "A project's plan as it stood on a day: its figures and each task's dates and hours. Set from the project; never edited."
  fields:
    - {name: baseline_name, type: data, label: Name, required: true, in_list: true}
    - {name: project, type: link, to: Project, required: true, in_list: true, in_filter: true}
    - {name: company, type: link, to: Company, fetch_from: project.company, read_only: true, in_filter: true}
    - {name: project_private, type: check, fetch_from: project.proj_private, read_only: true, hidden: true, no_copy: true, description: "Its project is its members' alone (kept in step with the project)"}
    - {name: taken_on, type: date, in_list: true}
    - {name: taken_by, type: email}
    - {name: start_date, type: date}
    - {name: end_date, type: date, in_list: true}
    - {name: estimated_hours, type: decimal}
    - {name: estimated_cost, type: currency}
    - {name: budget, type: currency}
    - {name: contract_value, type: currency}
    - {name: tasks, type: table, of: BaselineTask}
  unique: [[project, baseline_name]]
  indexes: [[project, taken_on]]
  list: {columns: [baseline_name, project, taken_on, end_date], sort: taken_on desc}

- name: ProjectUpdate
  label: Status Update
  kind: master
  module: projects
  title_field: health
  company_scoped: true
  owner_fields: [author]
  description: "How a project is going on a day: a health rating and a summary. The project shows its latest one's rating."
  fields:
    - {name: project, type: link, to: Project, required: true, in_list: true, in_filter: true}
    - {name: company, type: link, to: Company, fetch_from: project.company, read_only: true, in_filter: true}
    - {name: project_private, type: check, fetch_from: project.proj_private, read_only: true, hidden: true, no_copy: true, description: "Its project is its members' alone (kept in step with the project)"}
    - {name: on_date, type: date, label: Date, required: true, default_expr: today, in_list: true, in_filter: true}
    - {name: health, type: select, options: [On Track, At Risk, Off Track], required: true, in_list: true, in_filter: true}
    - {name: summary, type: text, required: true}
    - {name: author, type: email, read_only: true, no_copy: true, in_list: true}
  rules:
    - {name: on_date, check: "doc.on_date <= today", message: "A status update is not dated in the future"}
  indexes: [[project, on_date]]
  list: {columns: [project, on_date, health, author], sort: on_date desc}

- name: Sprint
  label: Sprint
  kind: master
  module: projects
  title_field: sprint_name
  company_scoped: true
  description: "A stretch of days a team commits tasks to. Planned, then Active (one a project), then Closed: closing records what was done and moves the rest on."
  fields:
    - {name: sprint_name, type: data, label: Name, required: true, in_list: true}
    - {name: project, type: link, to: Project, required: true, in_list: true, in_filter: true}
    - {name: company, type: link, to: Company, fetch_from: project.company, read_only: true, in_filter: true}
    - {name: project_private, type: check, fetch_from: project.proj_private, read_only: true, hidden: true, no_copy: true, description: "Its project is its members' alone (kept in step with the project)"}
    - {name: start_date, type: date, required: true, in_list: true}
    - {name: end_date, type: date, required: true, in_list: true}
    - {name: goal, type: text}
    - {name: state, type: select, options: [Planned, Active, Closed], default: Planned, read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: started_on, type: date, read_only: true, no_copy: true}
    - {name: closed_on, type: date, read_only: true, no_copy: true}
    - {name: committed_points, type: decimal, read_only: true, no_copy: true, description: "The points of its tasks when it started"}
    - {name: committed_tasks, type: int, read_only: true, no_copy: true}
    - {name: completed_points, type: decimal, read_only: true, no_copy: true, description: "The points of its tasks that were done when it closed"}
    - {name: completed_tasks, type: int, read_only: true, no_copy: true}
    - {name: carried_over, type: int, read_only: true, no_copy: true, description: "Tasks not done when it closed, moved to another sprint or back to the backlog"}
  rules:
    - {name: period, check: "doc.end_date >= doc.start_date", message: "A sprint cannot end before it starts"}
  unique: [[project, sprint_name]]
  indexes: [[project, state]]
  actions:
    - name: start
      label: Start Sprint
      permission: write
      condition: "doc.state == 'Planned'"
      contract:
        effect: transactional_action
        returns: {type: object, properties: {state: {type: string}, committed_points: {type: string}, committed_tasks: {type: integer}}}
        completion: "The sprint is Active, with the points and tasks committed at its start recorded; its project has no other active sprint"
    - name: close
      label: Close Sprint
      permission: write
      condition: "doc.state == 'Active'"
      confirm: "Close the sprint? Tasks that are not done move to the sprint you name, or back to the backlog."
      params: [{name: move_open_to, type: link, to: Sprint, label: Move Open Tasks To, description: "A planned sprint of the same project; empty: the backlog"}]
      contract:
        effect: transactional_action
        returns: {type: object, properties: {state: {type: string}, completed_points: {type: string}, completed_tasks: {type: integer}, carried_over: {type: integer}, moved_to: {type: [string, "null"], format: uuid, x-ferrum-link: Sprint}}}
        completion: "The sprint is Closed with what was done recorded; every task of it that was not done or cancelled is in the sprint named, or in the backlog"
  list: {columns: [sprint_name, project, start_date, end_date, state], sort: start_date desc}
