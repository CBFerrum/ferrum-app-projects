package: projects
version: 0.12.0
label: Projects
description: Projects with task trees, dependencies and milestones, timesheets with costing and billing, activity rates, milestone and time-and-materials invoicing, and project profitability.
# Projects and customers are shared records; invoicing through ERP comes with the projects_erp
# connector (Ferrum docs/plan/apps-ui.md §13).
depends: [core, parties, project_records]
field_prefix: proj_

overlays:
  - entity: Project
    ops:
      - {op: add_options, field: status, options: [On Hold]}
      - {op: set_property, field: start_date, property: label, value: Expected Start Date}
      - {op: set_property, field: end_date, property: label, value: Expected End Date}
      - {op: add_field, after: status, field: {name: proj_priority, type: select, label: Priority, options: [Low, Medium, High, Urgent], default: Medium, in_filter: true}}
      - {op: add_field, after: proj_priority, field: {name: proj_project_manager, type: email, label: Project Manager, in_filter: true, description: Email of the user who manages the project}}
      - {op: add_field, after: proj_project_manager, field: {name: proj_private, type: check, label: Private, in_filter: true, description: "Only its team (and Projects Managers) see it and its tasks; otherwise every Projects User reads them"}}
      - {op: add_field, after: proj_project_manager, field: {name: proj_project_type, type: link, to: ProjectType, label: Project Type, in_filter: true}}
      - {op: add_field, after: proj_project_type, field: {name: proj_task_workflow, type: link, to: TaskWorkflow, label: Task Workflow, description: "The statuses its tasks go through; empty: its type's, else the default"}}
      - {op: add_field, after: proj_task_workflow, field: {name: proj_is_template, type: check, label: Template, in_filter: true, no_copy: true, description: "A plan to copy: its tasks hold days from the start instead of dates, and no time is booked on it"}}
      - {op: add_field, after: proj_private, field: {name: proj_shared, type: check, label: Shared with the Client, in_filter: true, description: "The customer's portal people (Customer, Client People) read it, its client-visible tasks and milestones, its approved timesheets and invoices"}}
      - {op: add_field, after: proj_private, field: {name: proj_members, type: table, of: ProjectMember, label: Team, description: "Who works on it and their role: a manager changes the project and its tasks, a member its tasks, a viewer reads them"}}
      - {op: add_field, after: end_date, field: {name: proj_actual_start_date, type: date, label: Actual Start Date, read_only: true, no_copy: true, description: First submitted time log}}
      - {op: add_field, after: proj_actual_start_date, field: {name: proj_actual_end_date, type: date, label: Actual End Date, read_only: true, no_copy: true, description: Last submitted time log}}
      - {op: add_field, after: customer, field: {name: proj_billing_method, type: select, label: Billing Method, options: [Time and Materials, Fixed Price, Non-billable], default: Time and Materials, required: true, in_filter: true}}
      - {op: add_field, after: proj_billing_method, field: {name: proj_contract_value, type: currency, currency: currency, label: Contract Value, min: "0", visible_if: "doc.proj_billing_method == 'Fixed Price'", required_if: "doc.proj_billing_method == 'Fixed Price'"}}
      - {op: add_field, after: budget, field: {name: proj_estimated_cost, type: currency, currency: currency, label: Estimated Cost, min: "0"}}
      - {op: add_field, after: proj_estimated_cost, field: {name: proj_estimated_hours, type: decimal, label: Estimated Hours, min: "0"}}
      - {op: add_field, after: proj_estimated_hours, field: {name: proj_percent_complete_method, type: select, label: "% Complete Method", options: [Task Progress, Manual], default: Task Progress, description: "Task Progress: the tasks without sub-tasks (a parent is its sub-tasks), each weighed by its expected hours (all alike when none has any); done counts as 100%, cancelled tasks drop out"}}
      - {op: add_field, after: proj_percent_complete_method, field: {name: proj_percent_complete, type: percent, label: "% Complete", min: "0", max: "100", read_only_if: "doc.proj_percent_complete_method != 'Manual'", in_list: true}}
      - {op: add_field, after: proj_percent_complete, field: {name: proj_health, type: select, label: Health, options: [On Track, At Risk, Off Track], read_only: true, no_copy: true, in_filter: true, description: "From its latest status update"}}
      - {op: add_field, after: proj_health, field: {name: proj_health_on, type: date, label: Health As Of, read_only: true, no_copy: true, description: "The day of its latest status update"}}
      - {op: add_field, field: {name: proj_actual_hours, type: decimal, label: Actual Hours, read_only: true, no_copy: true}}
      - {op: add_field, field: {name: proj_costing_amount, type: currency, currency: currency, label: Timesheet Cost, read_only: true, no_copy: true}}
      - {op: add_field, field: {name: proj_billable_amount, type: currency, currency: currency, label: Billable Time, read_only: true, no_copy: true}}
      - {op: add_field, field: {name: proj_billed_amount, type: currency, currency: currency, label: Billed Amount, read_only: true, no_copy: true, description: Invoiced time and milestones}}
      - {op: add_field, field: {name: proj_approved_changes, type: int, label: Approved Changes, read_only: true, no_copy: true, description: "Change requests approved, each moving the plan by its effects"}}
      - {op: add_field, field: {name: proj_baselined_on, type: date, label: Baselined On, read_only: true, no_copy: true, description: "When the first approved change kept the plan as it was before it"}}
      - {op: add_field, field: {name: proj_baseline_end_date, type: date, label: Baseline End Date, read_only: true, no_copy: true}}
      - {op: add_field, field: {name: proj_baseline_hours, type: decimal, label: Baseline Hours, read_only: true, no_copy: true}}
      - {op: add_field, field: {name: proj_baseline_cost, type: currency, currency: currency, label: Baseline Cost, read_only: true, no_copy: true}}
      - {op: add_field, field: {name: proj_baseline_budget, type: currency, currency: currency, label: Baseline Budget, read_only: true, no_copy: true}}
      - {op: add_field, field: {name: proj_baseline_value, type: currency, currency: currency, label: Baseline Contract Value, read_only: true, no_copy: true}}
      - {op: add_rule, rule: {name: proj_contract_value, check: "doc.proj_billing_method != 'Fixed Price' || doc.proj_contract_value > 0.0", message: "A fixed price project needs a contract value"}}
      - {op: add_action, action: {name: complete, label: Complete Project, permission: write, condition: "doc.status != 'Completed' && doc.status != 'Cancelled'", confirm: "Complete the project? With force, its open tasks are cancelled.",
                                  params: [{name: force, type: select, options: ["No", "Yes"], label: Cancel Its Open Tasks, description: "Yes cancels the open tasks first; No refuses while any is open"}],
                                  contract: {returns: {type: object, properties: {status: {type: string}, cancelled_tasks: {type: integer}}}, completion: "The project is Completed; with force, its open tasks were cancelled first, each by its own save"}}}
      - {op: add_action, action: {name: set_baseline, label: Set Baseline, permission: write, condition: "!doc.proj_is_template",
                                  params: [{name: name, type: data, label: Name, required: true, description: "What to call this baseline, once in the project"}],
                                  contract: {returns: {type: object, properties: {entity: {type: string}, id: {type: string, format: uuid}, number: {type: [string, "null"]}, tasks: {type: integer}}},
                                             completion: "A new baseline holds the project's plan figures and each task's dates and hours as they are now; the project and its tasks are unchanged"}}}
      - {op: add_action, action: {name: save_as_template, label: Save as Template, permission: write, condition: "!doc.proj_is_template",
                                  params: [{name: template_name, type: data, label: Template Name, required: true},
                                           {name: calendar, type: data, label: Business Calendar, description: "Count the tasks' days in its working days; empty: calendar days"}],
                                  contract: {returns: {type: object, properties: {entity: {type: string}, id: {type: string, format: uuid}, number: {type: [string, "null"]}, tasks: {type: integer}}}, completion: "A new template project holds a copy of the tasks, their dependencies, estimates and the team; the source project is unchanged"}}}
      - {op: add_action, action: {name: create_from_template, label: Create Project, permission: read, condition: "doc.proj_is_template",
                                  params: [{name: project_name, type: data, label: Project Name, required: true}, {name: start_date, type: date, label: Starts On, required: true},
                                           {name: customer, type: link, to: Customer, label: Customer},
                                           {name: calendar, type: data, label: Business Calendar, description: "Place the tasks on its working days; empty: calendar days"}],
                                  contract: {returns: {type: object, properties: {entity: {type: string}, id: {type: string, format: uuid}, number: {type: [string, "null"]}, tasks: {type: integer}}}, completion: "A new project holds the template's tasks, dated from the start given, with its dependencies and team"}}}
      - {op: set_entity_property, property: list, value: {columns: [number, project_name, customer, status, proj_percent_complete], sort: created_at desc}}
  - entity: Customer
    ops:
      - {op: add_field, field: {name: proj_portal_people, type: table, of: ProjectClientPerson, label: Client People, description: "The customer's people who read its shared projects on the portal"}}

modules:
  - name: projects
    label: Projects
    icon: briefcase
    order: 50
    items: [Project, Task, Sprint, Timesheet, ProjectRisk, ProjectIssue, ProjectUpdate, ChangeRequest, ProjectBaseline, ResourceAllocation, Portfolio, ActivityType, ActivityCost, RateCard, TaskStatus, TaskWorkflow, ProjectType, ProjectPerson, TaskImport, TaskImportMapping, ProjectsSettings, report:project_profitability, report:earned_value,
            report:timesheet_summary, report:task_overview, report:workload, report:portfolio_overview]

roles:
  - name: Projects Manager
    description: Plans projects and tasks, sees costs, and bills customers for time and milestones.
    permissions:
      - {entity: Project, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: Task, read: true, write: true, create: true, delete: true, export: true, import: true, read_groups: [billing], write_groups: [billing]}
      - {entity: Timesheet, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true, read_groups: [costing], write_groups: [costing]}
      - {entity: TimesheetDetail, read_groups: [costing], write_groups: [costing]}
      - {entity: ActivityType, read: true, write: true, create: true, delete: true, read_groups: [costing], write_groups: [costing]}
      - {entity: ActivityCost, read: true, write: true, create: true, delete: true, import: true}
      - {entity: RateCard, read: true, write: true, create: true, delete: true, import: true, export: true, read_groups: [costing], write_groups: [costing]}
      - {entity: ProjectRisk, read: true, write: true, create: true, delete: true, export: true}
      - {entity: ProjectIssue, read: true, write: true, create: true, delete: true, export: true}
      - {entity: ChangeRequest, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true, read_groups: [costing], write_groups: [costing]}
      # A baseline is set by the project's action and never edited: nobody creates or writes one by hand.
      - {entity: ProjectBaseline, read: true, delete: true, export: true}
      - {entity: ProjectUpdate, read: true, write: true, create: true, delete: true, export: true}
      - {entity: Sprint, read: true, write: true, create: true, delete: true, export: true}
      - {entity: TaskImport, read: true, write: true, create: true, delete: true}
      - {entity: TaskImportMapping, read: true, write: true, create: true, delete: true}
      - {entity: ResourceAllocation, read: true, write: true, create: true, delete: true, export: true}
      - {entity: Portfolio, read: true, write: true, create: true, delete: true}
      - {entity: TaskStatus, read: true, write: true, create: true, delete: true}
      - {entity: TaskWorkflow, read: true, write: true, create: true, delete: true}
      - {entity: ProjectType, read: true, write: true, create: true, delete: true}
      - {entity: ProjectPerson, read: true, write: true, create: true, delete: true, import: true}
      - {entity: ProjectsSettings, read: true, write: true, create: true}
      - {entity: Customer, read: true}
      - {entity: Company, read: true}
      - {entity: Currency, read: true}
      - {entity: PriceList, read: true}
      - {entity: TaxTemplate, read: true}
  - name: Projects User
    description: Records own time and works on the tasks assigned to them.
    permissions:
      # A project's people read it and its records and write by their role on it; an open project is every Projects
      # User's to read, a private one its team's alone (Project, Task and the rest follow the project's `proj_private`).
      - {entity: ProjectRisk, read: true, where: {project_private: false}}
      - {entity: ProjectRisk, read: true, via: project.proj_members.person}
      - {entity: ProjectIssue, read: true, write: true, create: true, where: {project_private: false}}
      - {entity: ProjectIssue, read: true, write: true, create: true, via: project.proj_members.person}
      - {entity: ChangeRequest, read: true, write: true, create: true, submit: true, where: {project_private: false}}
      - {entity: ChangeRequest, read: true, write: true, create: true, submit: true, via: project.proj_members.person}
      - {entity: ProjectBaseline, read: true, where: {project_private: false}}
      - {entity: ProjectBaseline, read: true, via: project.proj_members.person}
      # A project's status updates: posted by its managers (the team's and the one named on it), read like the project.
      - {entity: ProjectUpdate, read: true, where: {project_private: false}}
      - {entity: ProjectUpdate, read: true, via: project.proj_members.person}
      - {entity: ProjectUpdate, read: true, write: true, create: true, delete: true, via: project.proj_members.manager}
      - {entity: ProjectUpdate, read: true, write: true, create: true, delete: true, via: project.proj_project_manager}
      # A project's sprints: planned, started and closed by its managers, read like the project.
      - {entity: Sprint, read: true, where: {project_private: false}}
      - {entity: Sprint, read: true, via: project.proj_members.person}
      - {entity: Sprint, read: true, write: true, create: true, delete: true, via: project.proj_members.manager}
      - {entity: Sprint, read: true, write: true, create: true, delete: true, via: project.proj_project_manager}
      # Importing tasks into a project is its managers'; the mappings are everyone's to read.
      - {entity: TaskImportMapping, read: true}
      - {entity: TaskImport, read: true, write: true, create: true, delete: true, via: project.proj_members.manager}
      - {entity: TaskImport, read: true, write: true, create: true, delete: true, via: project.proj_project_manager}
      - {entity: ResourceAllocation, read: true, if_owner: true}
      - {entity: Portfolio, read: true}
      - {entity: Project, read: true, where: {proj_private: false}}
      - {entity: Project, read: true, via: proj_members.person}
      - {entity: Project, read: true, write: true, via: proj_members.manager}
      - {entity: Task, read: true, write: true, if_owner: true, read_groups: [billing]}
      - {entity: Task, create: true, if_owner: true, where: {project_private: false}}
      - {entity: Task, read: true, where: {project_private: false}, read_groups: [billing]}
      - {entity: Task, read: true, via: project.proj_members.person, read_groups: [billing]}
      - {entity: Task, read: true, write: true, create: true, via: project.proj_members.editor, read_groups: [billing]}
      - {entity: Timesheet, read: true, write: true, create: true, delete: true, submit: true, cancel: true, if_owner: true}
      - {entity: ActivityType, read: true}
      - {entity: TaskStatus, read: true}
      - {entity: TaskWorkflow, read: true}
      - {entity: ProjectType, read: true}
      - {entity: Company, read: true}
      - {entity: Customer, read: true}
  - name: Project Client
    description: "For a customer's people, given to them by an administrator: read the projects of their customer that are shared with it, the tasks and milestones marked visible to the client, and the project's approved timesheets and invoices. Comments and files are not shared with portal people yet."
    portal: true
    permissions:
      # What staff write for staff is hidden (platform BD-40): per record on reads, refused in filters and sorts.
      - {entity: Project, read: true, via: customer.proj_portal_people.email, where: {proj_shared: true},
         hide: [notes, budget, proj_members, proj_project_manager, proj_estimated_cost, proj_costing_amount, proj_baseline_cost, proj_baseline_budget, proj_health, proj_health_on]}
      - {entity: Task, read: true, via: project.customer.proj_portal_people.email, where: {client_visible: true, project_shared: true}, hide: [assigned_to, sprint, story_points]}
      - {entity: Timesheet, read: true, via: portal_project.customer.proj_portal_people.email, where: {portal_shared: true, status: [Submitted, Partly Billed, Billed]},
         hide: [user, note, approvers]}
      # A table's columns are hidden through the rows' own entity (a rule that grants nothing, only hides).
      - {entity: TimesheetDetail, hide: [billing_rate]}
  - name: Accounts Manager
    permissions:
      - {entity: Timesheet, read: true, export: true, read_groups: [costing]}
      - {entity: TimesheetDetail, read_groups: [costing]}
      - {entity: Task, read: true, read_groups: [billing]}
      - {entity: ActivityType, read: true, read_groups: [costing]}
      - {entity: ActivityCost, read: true}
      - {entity: RateCard, read: true, read_groups: [costing]}
personal_data:
  - {entity: Project, match: proj_members.person, erase: [proj_members]}
  - {entity: Customer, match: proj_portal_people.email, erase: [proj_portal_people]}
  - {entity: Timesheet, match: user, retain: "Billing records"}
  - {entity: ActivityCost, match: user, retain: "Costing records"}
  - {entity: ProjectPerson, match: user, retain: "Staffing records"}
  - {entity: ProjectBaseline, match: taken_by, erase: [taken_by]}
  - {entity: ProjectUpdate, match: author, erase: [author]}
  - {entity: RateCard, match: user, retain: "Costing records"}
# What a workspace used to add by hand: a timesheet asks the approvers the app names (its projects' managers, or the
# person's manager, as Projects Settings says; never the person themselves), and goes straight through when it names none.
approvals:
  - entity: Timesheet
    on: submit
    policy:
      steps:
        - {label: Managers, approvers: {field: approvers}, need: all, when: "!isEmpty(doc.approvers)"}
      lock: true
handover:
  - {entity: Task, field: assigned_to.user, where: {status_category: [To Do, In Progress]}}

# The statuses every workspace starts with, and the Standard workflow holding them.
seed:
  - entity: TaskStatus
    key: [status_name]
    records:
      - {status_name: Overdue, category: To Do, sort_order: 4}
      - {status_name: Open, category: To Do, sort_order: 1, late_status: "@TaskStatus:status_name=Overdue"}
      - {status_name: Working, category: In Progress, sort_order: 2}
      - {status_name: Pending Review, category: In Progress, sort_order: 3}
      - {status_name: Completed, category: Done, sort_order: 5}
      - {status_name: Cancelled, category: Cancelled, sort_order: 6}
  - entity: TaskImportMapping
    key: [mapping_name]
    records:
      - mapping_name: Spreadsheet
        description: "A spreadsheet saved as CSV with these headings"
        columns:
          - {target: Key, source: "Key"}
          - {target: Subject, source: "Task"}
          - {target: Parent, source: "Parent"}
          - {target: Depends On, source: "Depends On"}
          - {target: Status, source: "Status"}
          - {target: Priority, source: "Priority"}
          - {target: Assignees, source: "Assignees"}
          - {target: Start, source: "Start"}
          - {target: End, source: "End"}
          - {target: Hours, source: "Hours"}
          - {target: Points, source: "Points"}
          - {target: Milestone, source: "Milestone"}
          - {target: Description, source: "Description"}
      - mapping_name: Jira (CSV export)
        description: "Issues exported from Jira as CSV"
        date_format: "%d/%b/%y %I:%M %p"
        hours_unit: Seconds
        unknown_people: Leave Out
        columns:
          - {target: Key, source: "Issue key"}
          - {target: Subject, source: "Summary"}
          - {target: Parent, source: "Parent"}
          - {target: Status, source: "Status"}
          - {target: Priority, source: "Priority"}
          - {target: Assignees, source: "Assignee"}
          - {target: End, source: "Due date"}
          - {target: Hours, source: "Original estimate"}
          - {target: Description, source: "Description"}
        values:
          - {field: Status, source: "To Do", becomes: To Do}
          - {field: Status, source: "In Progress", becomes: In Progress}
          - {field: Status, source: "Done", becomes: Done}
          - {field: Priority, source: "Highest", becomes: Urgent}
          - {field: Priority, source: "High", becomes: High}
          - {field: Priority, source: "Medium", becomes: Medium}
          - {field: Priority, source: "Low", becomes: Low}
          - {field: Priority, source: "Lowest", becomes: Low}
      - mapping_name: Asana (CSV export)
        description: "A project exported from Asana as CSV"
        columns:
          - {target: Key, source: "Task ID"}
          - {target: Subject, source: "Name"}
          - {target: Parent, source: "Parent task"}
          - {target: Depends On, source: "Blocked By (Dependencies)"}
          - {target: Status, source: "Section/Column"}
          - {target: Assignees, source: "Assignee Email"}
          - {target: Start, source: "Start Date"}
          - {target: End, source: "Due Date"}
          - {target: Description, source: "Notes"}
        values:
          - {field: Status, source: "To do", becomes: To Do}
          - {field: Status, source: "Doing", becomes: In Progress}
          - {field: Status, source: "Done", becomes: Done}
      - mapping_name: MS Project (CSV export)
        description: "Tasks saved from Microsoft Project as CSV"
        date_format: "%a %m/%d/%y"
        unknown_people: Leave Out
        unknown_links: Leave Out
        columns:
          - {target: Key, source: "ID"}
          - {target: Subject, source: "Name"}
          - {target: Level, source: "Outline Level"}
          - {target: Depends On, source: "Predecessors"}
          - {target: Assignees, source: "Resource Names"}
          - {target: Start, source: "Start"}
          - {target: End, source: "Finish"}
  - entity: TaskWorkflow
    key: [workflow_name]
    records:
      - workflow_name: Standard
        is_default: true
        statuses:
          - {status: "@TaskStatus:status_name=Open"}
          - {status: "@TaskStatus:status_name=Working"}
          - {status: "@TaskStatus:status_name=Pending Review"}
          - {status: "@TaskStatus:status_name=Overdue"}
          - {status: "@TaskStatus:status_name=Completed"}
          - {status: "@TaskStatus:status_name=Cancelled"}

# What the app sends; a workspace edits the wording under Settings.
messages:
  - key: projects.task_overdue
    label: A task is overdue
    values: [task, number, due, project]
    languages:
      en:
        email:
          subject: "Overdue: {{ values.number }} {{ values.task }}"
          body: "<p>{{ values.number }} {{ values.task }} of {{ values.project }} was due on {{ values.due }} and is not started.</p>"
        inapp:
          title: "{{ values.number }} {{ values.task }} is overdue"
          text: "{{ values.project }} · due {{ values.due }}"
  - key: projects.milestone_reached
    label: A milestone is completed
    values: [task, number, project]
    languages:
      en:
        email:
          subject: "Milestone reached: {{ values.task }}"
          body: "<p>{{ values.number }} {{ values.task }} of {{ values.project }} is completed.</p>"
        inapp:
          title: "Milestone reached: {{ values.task }}"
          text: "{{ values.project }}"
  - key: projects.task_due
    label: A task is due tomorrow
    values: [task, number, due]
    languages:
      en:
        email:
          subject: "Due tomorrow: {{ values.number }} {{ values.task }}"
          body: "<p>{{ values.number }} {{ values.task }} is due on {{ values.due }}.</p>"
        inapp:
          title: "{{ values.number }} {{ values.task }} is due tomorrow"
          text: "Due {{ values.due }}"
  - key: projects.time_missing
    label: Time short for the week
    values: [week_start, hours, expected]
    languages:
      en:
        email:
          subject: "Your time for the week of {{ values.week_start }}"
          body: "<p>You have recorded {{ values.hours }} hours for the week of {{ values.week_start }}, of the {{ values.expected }} expected. Please fill in your timesheet.</p>"
        inapp:
          title: "Your time for the week of {{ values.week_start }} is short"
          text: "{{ values.hours }} of {{ values.expected }} hours recorded."

# Shipped switched on; an administrator switches them off or edits them under Administration. In the app only.
automations:
  - name: projects_task_overdue
    entity: Task
    event: updated
    condition: "doc.status_category == 'To Do' && old.task_status != doc.task_status && !isEmpty(doc.exp_end_date) && doc.exp_end_date < today && !isEmpty(links.project.proj_project_manager)"
    actions:
      - {type: message, template: projects.task_overdue, to: ["expr:links.project.proj_project_manager"], channels: [inapp],
         values: {task: "doc.subject", number: "doc.number", due: "doc.exp_end_date", project: "links.project.project_name"}}
  - name: projects_milestone_reached
    entity: Task
    event: updated
    condition: "doc.is_milestone && doc.status_category == 'Done' && old.status_category != 'Done' && !isEmpty(links.project.proj_project_manager)"
    actions:
      - {type: message, template: projects.milestone_reached, to: ["expr:links.project.proj_project_manager"], channels: [inapp],
         values: {task: "doc.subject", number: "doc.number", project: "links.project.project_name"}}
  - name: projects_task_due_tomorrow
    entity: Task
    event: scheduled
    schedule: {relative: {field: exp_end_date, offset: "-P1D", at: "09:00"}}
    condition: "doc.status_category == 'To Do' || doc.status_category == 'In Progress'"
    actions:
      - type: for_each
        table: assigned_to
        effects:
          - {type: message, template: projects.task_due, to: ["expr:item.user"], channels: [inapp],
             values: {task: "doc.subject", number: "doc.number", due: "doc.exp_end_date"}}
